services:
  app:
    build: .
    image: autobuy:latest
    env_file: .env
    environment:
      # Force Postgres in docker-compose; overrides DATABASE_URL from .env
      # so an accidental sqlite URL in .env won't silently lose data on rebuild.
      DATABASE_URL: postgresql+psycopg://autobuy:autobuy@db:5432/autobuy
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autobuy
      POSTGRES_PASSWORD: autobuy
      POSTGRES_DB: autobuy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobuy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
